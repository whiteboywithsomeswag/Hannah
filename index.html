<!DOCTYPE html>
<html>
<head>
  <title>ESP32 OLED Message</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background: #111;
      color: white;
    }

    textarea {
      width: 300px;
      height: 120px;
      font-size: 18px;
      padding: 10px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>ESP32 OLED Message</h1>

<textarea id="message">Hello from GitHub!</textarea>
<br>
<button onclick="saveMessage()">Save Message</button>

<script>
async function saveMessage() {
  const msg = document.getElementById('message').value;

  localStorage.setItem('oledMessage', msg);

  alert('Message Saved!');
}
</script>

</body>
</html>
