<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Live Controller</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      margin-top: 40px;
    }

    textarea {
      width: 350px;
      height: 120px;
      font-size: 16px;
    }

    input, select {
      margin: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>ESP32 LIVE CONTROL</h1>

<textarea id="msg">Hello ESP32</textarea>

<br>

<label>Size</label>
<input type="range" id="size" min="1" max="4" value="2">

<br>

<label>Speed</label>
<input type="range" id="speed" min="5" max="50" value="20">

<br>

<label>Direction</label>
<select id="dir">
  <option value="left">Left</option>
  <option value="right">Right</option>
  <option value="up">Up</option>
</select>

<br><br>

<button onclick="send()">Send Live Update</button>

<script>

async function send() {

  const data = {
    message: document.getElementById("msg").value,
    size: Number(document.getElementById("size").value),
    speed: Number(document.getElementById("speed").value),
    dir: document.getElementById("dir").value
  };

  await fetch("https://api.github.com/repos/whiteboywithsomeswag/Hannah/dispatches", {
    method: "POST",
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer 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",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      event_type: "update-oled",
      client_payload: data
    })
  });

  alert("Sent!");
}

</script>

</body>
</html>
