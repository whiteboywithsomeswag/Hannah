<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Live Message</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      margin-top: 40px;
    }

    textarea {
      width: 400px;
      height: 150px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>ESP32 Message Control</h1>

<textarea id="msg">Type up to ~8 sentences here...</textarea>
<br>

<button onclick="send()">Send to ESP32</button>

<script>

const BIN_ID = "69fc130e250b1311c3159709";
const API_KEY = "$2a$10$9E6n6n0ZbtyrLdwRZdLfGuqvo1yOxOrgmSRUdmwHr87h0eZXK5L12";

async function send() {
  
  const text = document.getElementById("msg").value;
  document.getElementById("msg").value = "silly";

  const res = await fetch(`https://api.jsonbin.io/v3/b/69fc130e250b1311c3159709`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": "$2a$10$9E6n6n0ZbtyrLdwRZdLfGuqvo1yOxOrgmSRUdmwHr87h0eZXK5L12";
    },
    body: JSON.stringify({
      message: text
    })
  });

  if (res.ok) {
    alert("Sent to ESP32!");
  } else {
    alert("Failed to send");
  }
}

</script>

</body>
</html>
