<!DOCTYPE html>
<html>
<head>
  <title>ESP32 OLED Dashboard</title>

  <style>
    body {
      background: #0d0d0d;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
    }

    h1 {
      margin-top: 20px;
    }

    .panel {
      margin-top: 20px;
    }

    textarea {
      width: 360px;
      height: 120px;
      font-size: 16px;
      padding: 10px;
      border-radius: 10px;
      border: none;
    }

    input {
      margin: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #00c3ff;
      cursor: pointer;
    }

    .preview {
      margin-top: 30px;
      font-size: 20px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<h1>ESP32 OLED Dashboard</h1>

<div class="panel">

  <textarea id="message">Hello ESP32</textarea>
  <br>

  <label>Color</label>
  <input type="color" id="color" value="#ffffff">

  <label>Speed</label>
  <input type="range" id="speed" min="5" max="50" value="20">

  <label>Size</label>
  <input type="range" id="size" min="1" max="4" value="2">

  <br><br>

  <button onclick="save()">Save to ESP</button>

</div>

<div class="preview" id="preview"></div>

<script>

const API_URL = "https://api.github.com/repos/whiteboywithsomeswag/Hannah/dispatches";
// (we set this up next)

function updatePreview() {
  const data = getData();
  document.getElementById("preview").innerText = JSON.stringify(data, null, 2);
}

function getData() {
  return {
    message: document.getElementById("message").value,
    color: document.getElementById("color").value,
    speed: Number(document.getElementById("speed").value),
    size: Number(document.getElementById("size").value)
  };
}

async function save() {

  const data = getData();

  await fetch(API_URL, {
    method: "POST",
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer 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"
    },
    body: JSON.stringify({
      event_type: "update-oled",
      client_payload: data
    })
  });
  alert("Saved!");
}

["message","color","speed","size"].forEach(id => {
  document.getElementById(id).addEventListener("input", updatePreview);
});

updatePreview();

</script>

</body>
</html>
